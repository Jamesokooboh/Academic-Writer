services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      network: host
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/academic_writer.db
    volumes:
      - backend_data:/app/data
      - hf_cache:/root/.cache/huggingface

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
  hf_cache:
